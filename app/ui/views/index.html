<!doctype html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Security: only this site's own scripts/styles run, and the page may only talk to itself and Supabase.
       Keeps injected scripts from loading code or sending data elsewhere. Also send frame-ancestors 'none'
       and the same policy as real HTTP headers when you deploy (a meta tag can't set frame-ancestors). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Clio</title>
  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app">
    <div id="sidebar-root"></div>

    <div class="workspace">
      <div id="topbar-root"></div>

      <main id="main-content" class="main" tabindex="-1">
        <div id="project-form-root"></div>

        <div id="project-detail-root"></div>

        <div id="project-results-root"></div>
      </main>
    </div>
  </div>

  <div id="auth-modal-root"></div>

  <div id="search-dialog-root"></div>

  <div id="toast-root-slot"></div>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="../../core/icons.js"></script>
  <script src="../../core/config.js"></script>
  <script src="../../services/api-client.js"></script>
  <!-- UI classes -->
  <script src="components/sidebar.js"></script>
  <script src="components/topbar.js"></script>
  <script src="components/project-form.js"></script>
  <script src="components/project-detail.js"></script>
  <script src="components/project-results.js"></script>
  <script src="components/auth-modal.js"></script>
  <script src="components/search-dialog.js"></script>
  <script src="components/toast.js"></script>
  <!-- Runs the system -->
  <script src="../../controllers/auth-controller.js"></script>
  <script src="../../controllers/enter-button.js"></script>
  <script src="../../controllers/project-nav.js"></script>
  <script src="../../controllers/main.js"></script>
</body>
</html>
